# Voltaryx – Supabase project config
# https://supabase.com/docs/guides/local-development

[project]
project_id = "iyxruvociyldscbpotdv"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"
heartbeat_interval_ms = 30000
poll_interval_ms = 100
poll_max_changes = 100
poll_max_record_bytes = 1048576

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://voltaryx.vercel.app"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[auth.email.smtp]
host = ""
port = 587
user = ""
pass = ""
admin_email = "admin@voltaryx.app"
sender_name = "Voltaryx"

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_functions]
enabled = false

[analytics]
enabled = false
